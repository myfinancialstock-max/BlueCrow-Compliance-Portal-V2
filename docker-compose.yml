services:

  # ── Base de dados PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER:     postgres
      POSTGRES_PASSWORD: bluecrow
      POSTGRES_DB:       compliance_portal
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Aplicação FastAPI ─────────────────────────────────────────────────────
  app:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # Sobrepõe o DATABASE_URL do .env para usar o hostname "db" (Docker interno)
      DATABASE_URL: postgresql://postgres:bluecrow@db:5432/compliance_portal
    volumes:
      # Monta o código local → alterações no VS Code são imediatamente refletidas
      - .:/app
    depends_on:
      db:
        condition: service_healthy
    command: >
      bash -c "
        python -m alembic upgrade head &&
        python -m uvicorn backend.main:app --host 0.0.0.0 --port 8000 --reload
      "

volumes:
  postgres_data:
